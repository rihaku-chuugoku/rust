[package]
name = "rate-limiter-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A bounded REST reverse proxy with Redis-backed distributed rate limits"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros"] }
bytes = "1"
config = "0.15.25"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
percent-encoding = "2"
prometheus = "0.14"
redis = { version = "1.6", default-features = false, features = ["tokio-comp", "connection-manager", "script", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "stream","json"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.9", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }
tempfile = "3"

[[bench]]
name = "limiter_bench"
harness = false
